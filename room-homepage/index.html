<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/script.js"></script>
    <title>Frontend Mentor | Room homepage</title>
  </head>
  <body>
    <main>
      <section class="carousel">
        <ul class="carousel__imgs" aria-label="Gallery">
          <li>
            <picture>
              <source
                media="(min-width: 768px)"
                srcset="images/desktop-image-hero-1.jpg"
              />
              <source srcset="images/mobile-image-hero-1.jpg" />
              <img
                id="carousel__img--1"
                class="carousel__img slid-in"
                src="images/desktop-image-hero-1.jpg"
                alt="white chairs and table with bonsai"
                data-num="1"
              />
            </picture>
          </li>
          <li>
            <picture>
              <source
                media="(min-width: 768px)"
                srcset="images/desktop-image-hero-2.jpg"
              />
              <source srcset="images/mobile-image-hero-2.jpg" />
              <img
                id="carousel__img--2"
                class="carousel__img slid-in"
                src="images/desktop-image-hero-2.jpg"
                alt="three different coloured chairs"
                data-num="2"
              />
            </picture>
          </li>
          <li>
            <picture>
              <source
                media="(min-width: 768px)"
                srcset="images/desktop-image-hero-3.jpg"
              />
              <source srcset="images/mobile-image-hero-3.jpg" />
              <img
                id="carousel__img--3"
                class="carousel__img slid-in"
                src="images/desktop-image-hero-3.jpg"
                alt="three different coloured chairs"
                data-num="3"
              />
            </picture>
          </li>
        </ul>
        <div class="carousel__btns">
          <button
            id="carousel__btn--prev"
            class="carousel__btn carousel__btn--prev"
          >
            <img src="images/icon-angle-left.svg" alt="" /></button
          ><button
            id="carousel__btn--next"
            class="carousel__btn carousel__btn--next"
          >
            <img src="images/icon-angle-right.svg" alt="" />
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
